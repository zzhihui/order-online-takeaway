<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title></title>
    <link href="http://code.ionicframework.com/1.3.2/css/ionic.min.css" rel="stylesheet">
    <link href="css/style.min.css" rel="stylesheet">
    <!-- IF using Sass (run gulp sass first), then uncomment below and remove the CSS includes above
    <link href="css/ionic.app.css" rel="stylesheet">
    -->
    <!-- ionic/angularjs js -->
    <script src="http://code.ionicframework.com/1.3.2/js/ionic.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.4.5/angular-messages.min.js"></script>

    <!-- cordova script (this will be a 404 during development) -->
    <script src="js/lib/ng-cordova.min.js"></script>
    <script src="js/lib/angular-cache.min.js"></script>
    <script src="cordova.js"></script>

    <!-- your app's js -->
    <script src="js/app.js"></script>
    
</head>
<body ng-app="starter">
    <!--
    The nav bar that will be updated as we navigate between views.
    -->
    <ion-nav-bar class="bar-stable bar-assertive">
        <ion-nav-back-button>
        </ion-nav-back-button>
    </ion-nav-bar>
    <!--
    The views will be rendered in the <ion-nav-view> directive below
    Templates are in the /templates folder (but you could also
    have templates inline in this html file if you'd like).
    -->
    <ion-nav-view></ion-nav-view>
    <script id="error-list.html" type="text/ng-template">
        <div class="error" ng-message="required">
            <i class="ion-information-circled"></i>
            Please enter valid information!
        </div>
        <div class="error" ng-message="email">
            <i class="ion-information-circled"></i>
            Please enter valid information!
        </div>
        <div class="error" ng-message="minlength">
            <i class="ion-information-circled"></i>
            Please enter valid information!
        </div>
        <div class="error" ng-message="maxlength">
            <i class="ion-information-circled"></i>
            Please enter valid information!
        </div>
    </script>
</body>
</html>

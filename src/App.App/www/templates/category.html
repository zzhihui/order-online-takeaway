<ion-view view-title="Menu">
    <ion-content class="padding">
        <ion-list>
            <ion-item class="item item-divider">
                Please select your dish
            </ion-item>
            <div ng-repeat="group in groups">
                <ion-item class="item item-avatar item-text-wrap" style="background-color: #ffff99"
                          ng-click="toggleGroup(group)"
                          ng-class="{active: isGroupShown(group)}">
                    <img ng-src="{{group.webImageUrl}}" ng-if="group.webImageUrl">
                    <img ng-src="group/foodcategory.png" ng-if="!group.webImageUrl">
                    <h2>{{group.name}}</h2>
                    <p>{{group.description}}</p>
                </ion-item>
                <ion-item class="item-accordion item item-avatar item-text-wrap"
                          ng-repeat="item in group.items"
                          ng-show="isGroupShown(group)" href="#/tab/categoryitem/{{item.id}}">
                    <img ng-src="{{item.imageUrl}}" ng-if="item.imageUrl">
                    <img ng-src="img/food.png" ng-if="!item.imageUrl">
                    <h2>{{item.name}}</h2>
                    <p>{{item.description}}</p>
                    <span class="item-note">
                        <h2>{{"€"+(item.price | number:2)}}</h2>
                    </span>
                </ion-item>
            </div>
        </ion-list>
    </ion-content>
</ion-view>

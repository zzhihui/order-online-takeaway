<ion-view view-title="Payment">
    <ion-content class="padding">
       
            <!--Total-->
            <div class="item item-divider">Order Summery</div>
            <div class="item item-text-wrap">
                Order Total:
                <h3>{{"€"+(orderTotal | number:2)}}</h3>
            </div>
            <div class="item item-text-wrap">
                Delivery Charge:
                <h3>{{"€"+(deliveryTotal | number:2)}}</h3>
            </div>
            <div class="item item-text-wrap">
                Total Amount:
                <h1>{{"€"+(amount | number:2)}}</h1>
            </div>

           

            <!--Payment Information-->
           
            <div class="list card">
                <div class="item item-divider item-text-wrap">
                    Payment Options
                    <p>Please select a payment option</p>
                </div>

                <a href="#/tab/paymentcc" class="item item-icon-left" ng-click="paycc()">
                    <i class="icon ion-card"></i>
                    Pay by Credit Card
                </a>



                <a href="#" class="item item-icon-left" ng-click="paylater()">
                    <i class="icon ion-cash"></i>
                    Pay Cash Later
                </a>
    
            </div>
        
    </ion-content>
</ion-view>

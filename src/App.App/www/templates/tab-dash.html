<ion-view view-title="Welcome">
    <ion-content class="padding">
        <div class="row">
            <div>
                <h1 class="light">{{shopInfo.shopName}}</h1>
            </div>
        </div>
        <div class="row light">
            <div class="col-50">
                <div>Tel: {{shopInfo.shopNumber}}</div>
                <br />
                <div>Addr: {{shopInfo.shopAddress1}}, {{shopInfo.shopAddress2}}</div>
                <br />
                <div>
                    <a href="#/tab/deliveryarea" class="light">Delivery Area</a>
                </div>
            </div>
            <div class="col-40 col-offset-10">
                <div>Delivery Open Hours</div>
                <pre>{{shopInfo.shopOpenHours}}</pre>
                <div></div>

            </div>
        </div>
        <br />
        <div class="row">
            <a href="#/tab/category" class="button button-royal button-large ion-star">
                View Menu
            </a>
        </div>
        <div class="row">
            <div class="col">
                <img src="../img/ic_intro_step1.png" width="100px" height="100px">
            </div>
            <div class="col">
                <img src="../img/ic_intro_step2.png" width="100px" height="100px">
            </div>
            <div class="col">
                <img src="../img/ic_intro_step3.png" width="100px" height="100px">
            </div>
        </div>
        <br />
        <div class="row">
            <!--TODO: Load From Database-->
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d2387.5280080501684!2d-6.134678600000001!3d53.244236699999995!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x486708080c459b2d%3A0x25dd6e3221407aa5!2sOld+School+House%2C+Bray+Rd%2C+Loughlinstown%2C+Co.+Dublin!5e0!3m2!1sen!2sie!4v1430644880262" frameborder="0" style="border: 0"></iframe>
        </div>


        <ion-list>

            <ion-item class="item item-divider">
                News
            </ion-item>
            <ion-item class="item item-icon-left item-text-wrap" ng-repeat="news in shopNews" type="item-text-wrap">
                <i class="icon ion-document-text"></i>
                {{news.news}}

                <span class="item-note">
                    {{news.created| date:'dd-MMMM-yyyy'}}
                </span>
            </ion-item>
        </ion-list>

    </ion-content>
</ion-view>

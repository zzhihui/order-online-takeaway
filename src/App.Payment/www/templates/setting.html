<ion-view view-title="Setting">
    <ion-content class="padding">
        <form name="submitOrderForm" novalidate="">
            <!--Orde summary-->
            <div class="item item-divider">Administrator Setting</div>

            <label class="item item-input" ng-class="{ 'has-errors' : submitOrderForm.weburl.$invalid, 'no-errors' : submitOrderForm.weburl.$valid}">
                <input type="text" name="weburl" placeholder="WebSite URL" required ng-model="vm.weburl" ng-minlength="3" maxlength="200">
            </label>

            <label class="item item-input" ng-class="{ 'has-errors' : submitOrderForm.shopid.$invalid, 'no-errors' : submitOrderForm.shopid.$valid}">
                <input type="number" name="shopid" placeholder="shopid" required ng-model="vm.shopid">
            </label>

            <div class="item item-divider item-text-wrap">
                <h2 style="color: red">{{error}}</h2>
            </div>
            <button class="button button-block button-assertive" ng-click="saveSettings()" ng-disabled="!submitOrderForm.$valid">
                Save Settings
            </button>


        </form>
    </ion-content>
</ion-view>
